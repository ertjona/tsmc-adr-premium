name: Update TSMC ADR Premium Data

on:
  schedule:
    # Hourly on weekdays (UTC). GitHub starts scheduled runs late, often 2-5 hours and
    # up to ~9 hours, so two fixed runs missed their windows; with a run every hour
    # some always land after each close. Off the hour (:17) to avoid peak load.
    # Free for a public repo, and the data branch is force-pushed, so runs don't add history.
    - cron: '17 * * * 1-5'
  workflow_dispatch:           # allow manual runs

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          MPLBACKEND: Agg  # headless backend, CI has no display
        run: python tsmc_adr_premium.py 5y

      # Publish only the latest CSV + PNG as a single commit on the `data` branch,
      # force-pushed each run, so old outputs never pile up in git history.
      # The outputs are git-ignored on main, so they survive the orphan switch.
      - name: Publish to the data branch
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') Taipei"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan data
          cat > README.md <<EOF
          # TSMC ADR Premium (latest)

          Updated ${stamp}. Regenerated hourly on weekdays by the workflow on \`main\`;
          this branch holds only the latest output and is force-pushed each run.

          ![TSMC ADR premium](tsmc_adr_premium.png)

          Data: [tsmc_adr_premium.csv](tsmc_adr_premium.csv)
          EOF
          git add -f README.md tsmc_adr_premium.csv tsmc_adr_premium.png  # -f: outputs are git-ignored
          git commit -q -m "data: update ADR premium ${stamp}"
          git push --force origin data
