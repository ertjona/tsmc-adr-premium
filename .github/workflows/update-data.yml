name: Update TSMC ADR Premium Data

on:
  schedule:
    # GitHub cron 只能用 UTC，排程也可能延遲數十分鐘，所以預留緩衝
    - cron: '30 23 * * 1-5'  # 台股開盤前：台北週二～六 07:30（美股收盤後）
    - cron: '30 11 * * 1-5'  # 美股開盤前：台北週一～五 19:30（台股收盤後）
  workflow_dispatch:           # 允許手動觸發

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          MPLBACKEND: Agg  # headless backend，CI 環境不需要顯示器
        run: python tsmc_adr_premium.py 5y

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tsmc_adr_premium.csv tsmc_adr_premium.png
          git diff --staged --quiet || git commit -m "data: update ADR premium $(date -u +%Y-%m-%d)"
          git push
