name: Update TSMC ADR Premium Data

on:
  schedule:
    # GitHub cron is UTC-only and runs can start tens of minutes late, so leave a buffer
    - cron: '30 22 * * 1-5'  # before TWSE opens: Taipei Tue-Sat 06:30 (after the NYSE close)
    - cron: '30 11 * * 1-5'  # before NYSE opens: Taipei Mon-Fri 19:30 (after the TWSE close)
  workflow_dispatch:           # allow manual runs

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          MPLBACKEND: Agg  # headless backend, CI has no display
        run: python tsmc_adr_premium.py 5y

      # Publish only the latest CSV + PNG as a single commit on the `data` branch,
      # force-pushed each run, so old outputs never pile up in git history.
      # The outputs are git-ignored on main, so they survive the orphan switch.
      - name: Publish to the data branch
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') Taipei"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan data
          cat > README.md <<EOF
          # TSMC ADR Premium (latest)

          Updated ${stamp}. Regenerated twice per weekday by the workflow on \`main\`;
          this branch holds only the latest output and is force-pushed each run.

          ![TSMC ADR premium](tsmc_adr_premium.png)

          Data: [tsmc_adr_premium.csv](tsmc_adr_premium.csv)
          EOF
          git add -f README.md tsmc_adr_premium.csv tsmc_adr_premium.png  # -f: outputs are git-ignored
          git commit -q -m "data: update ADR premium ${stamp}"
          git push --force origin data
